# Tiles on the home page. Order here is display order.
#
# fields:
#   name  — tile label, bottom-left of the tile (required)
#   url   — where the tile links (required)
#   logo  — name of an svg in _includes/icons/ (drop new ones in there,
#           single-path monochrome svgs from https://simpleicons.org work as-is)
#   img   — full-color raster icon: filename in assets/icons/, shown as-is
#   icon  — fallback: a single character/emoji, used when no logo/img is set
#   desc  — short description; shown on wide tiles and as hover tooltip
#   size  — square (default) or wide
#   color — pink (default), mauve, lavender, teal, orange, green, surface,
#           or white (near-black in mocha / near-white in latte)
#   wordmark — true if the logo is wide text (renders in a wider box)

- name: do
  url: https://do.foid.space
  img: kaneo.svg
  desc: kaneo
  wordmark: true
  size: wide
  color: white

