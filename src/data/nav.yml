# Tiles on the home page. Order here is display order, and the nav bar on
# subpages follows it too.
#
# fields:
#   name   — the tile's overline: its name, lowercase by hand, set in mono
#            uppercase (required). A navigation tile puts it bottom left, a
#            live tile top left. A url that leaves the site gets a ↗ after it.
#   url    — where the tile links (required)
#   size   — square (1×1, 152px), wide (2×1, 312×152) or large (2×2,
#            312×312). default square.
#   icon   — a Phosphor icon (src/components/phosphor.ts), drawn top right
#            and sized in proportion to the tile. Every tile is raised.
#   navbar — whether the entry also appears in the nav bar shown on
#            subpages. omit it and the entry is included, so a new tile
#            can't drop out of the nav by accident; set it to false for
#            something that should be a tile only.

- name: music
  url: /music/
  icon: music-notes
  size: large
  navbar: true

- name: blog
  url: /blog/
  icon: article
  size: wide
  navbar: true

- name: projects
  url: /projects/
  icon: rocket
  size: large
  navbar: true

- name: about
  url: /about/
  icon: user
  navbar: true

- name: résumé
  url: /resume/
  icon: identification-card
  navbar: true

- name: gallery
  url: /gallery/
  icon: images
  navbar: true

- name: guestbook
  url: /guestbook/
  icon: book-open-text
  size: wide
  navbar: true

# external
- name: foid.space
  url: https://foid.space
  icon: cloud
  navbar: false
