# Tiles on the home page. Order here is display order, and the nav bar on
# subpages follows it too.
#
# fields:
#   name   — the tile's overline: its name, set in mono uppercase at the top
#            left (required). A url that leaves the site gets a ↗ after it.
#   url    — where the tile links (required)
#   size   — square (1×1, 64px), wide (2×1, 136×64) or large (2×2, 136×136).
#            default square. A name needs about 12px per letter plus 24px of
#            padding, so anything longer than 3 letters wants wide.
#   fill   — raised (default) or mantle. These are the only two tile fills;
#            the one loud tile and the live tiles (music, blog, guestbook,
#            projects) are always raised, set in src/pages/index.astro.
#   navbar — whether the entry also appears in the nav bar shown on
#            subpages. omit it and the entry is included, so a new tile
#            can't drop out of the nav by accident; set it to false for
#            something that should be a tile only.

- name: music
  url: /music/
  size: large
  navbar: true

- name: projects
  url: /projects/
  size: large
  navbar: true

- name: blog
  url: /blog/
  size: wide
  navbar: true

- name: about
  url: /about/
  size: wide
  fill: mantle
  navbar: true

- name: resume
  url: /resume/
  size: wide
  fill: mantle
  navbar: true

- name: gallery
  url: /gallery/
  size: wide
  fill: mantle
  navbar: true

- name: guestbook
  url: /guestbook/
  size: large
  navbar: true

# external
- name: foid.space
  url: https://foid.space
  size: wide
  fill: mantle
  navbar: false
