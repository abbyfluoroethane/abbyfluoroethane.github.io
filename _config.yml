title: abby bigaouette
description: i build things that go to space, break things that stay on earth, and occasionally muse about my thoughts.
url: "https://bigaouette.com"

# setting `exclude` replaces jekyll's default list rather than merging with
# it, so the defaults have to be repeated here or they stop being excluded
# (Gemfile was otherwise being published to /Gemfile)
exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor/
  - node_modules/

plugins:
  - jekyll-feed
  - jekyll-sitemap

markdown: kramdown
kramdown:
  smart_quotes: ["apos", "apos", "quot", "quot"]

permalink: /blog/:title/

collections:
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      app_name: blog
  - scope:
      path: ""
      type: projects
    values:
      layout: project
      app_name: projects

# public, read-only widget key (same one already committed in the old
# public repo) — fine to keep client-side, rotate at last.fm if desired.
lastfm:
  username: "abby_isnthere"
  api_key: "3d59870650c4a720a39500c654d23eb1"

