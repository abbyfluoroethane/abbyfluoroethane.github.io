{% assign lfm_id = include.id | default: "lastfm" %}
{% assign lfm_count = include.count | default: 1 %}
{% assign lfm_tile = include.tile | default: false %}
{% assign lfm_history_id = include.history_id %}
<div id="{{ lfm_id }}" class="lastfm-widget{% if lfm_tile %} lastfm-widget-tile{% endif %}" data-user="{{ site.lastfm.username }}" data-key="{{ site.lastfm.api_key }}" data-count="{{ lfm_count }}" data-tile="{{ lfm_tile }}" data-history-id="{{ lfm_history_id }}">
  <p class="{% if lfm_tile %}tile-live-label{% else %}lastfm-status{% endif %}">loading…</p>
</div>
<script>
(function () {
  var root = document.getElementById({{ lfm_id | jsonify }});
  if (!root) return;
  var user = root.dataset.user, key = root.dataset.key, count = root.dataset.count;
  var tileMode = root.dataset.tile === "true";
  var historyId = root.dataset.historyId;
  // keyed by count as well as user: the home tile asks for 1 track and
  // /music/ asks for 11, and a shared key let whichever page loaded last
  // hand the other a payload too short to render
  var cacheKey = "lastfm:" + user + ":" + count;
  var endpoint = "https://ws.audioscrobbler.com/2.0/?method=user.getrecenttracks"
    + "&user=" + encodeURIComponent(user)
    + "&api_key=" + encodeURIComponent(key)
    + "&format=json&limit=" + encodeURIComponent(count);

  function artUrl(t) {
    var images = t.image || [];
    for (var i = images.length - 1; i >= 0; i--) {
      var src = images[i]["#text"];
      if (src && src.indexOf("2a96cbd8b46e442fc41c2b86b821562f") === -1) return src;
    }
    return "";
  }

  // every string below comes from the last.fm API, so nothing is ever
  // concatenated into markup — nodes are built and filled via textContent,
  // and any URL bound for an href/src/css url() has to clear safeUrl first.
  function safeUrl(u) {
    return typeof u === "string" && /^https?:\/\//i.test(u) ? u : "";
  }

  function line(tag, cls, text) {
    var el = document.createElement(tag);
    el.className = cls;
    el.textContent = text;
    return el;
  }

  function coverEl(t, cls) {
    var cover = safeUrl(artUrl(t));
    if (!cover) {
      var ph = document.createElement("span");
      ph.className = cls + " lastfm-cover-empty";
      ph.setAttribute("aria-hidden", "true");
      return ph;
    }
    var img = document.createElement("img");
    img.className = cls;
    img.alt = "";
    img.addEventListener("load", function () { img.classList.add("is-loaded"); });
    img.src = cover;
    return img;
  }

  function trackArtist(t) {
    return t.artist && (t.artist["#text"] || t.artist.name) || "unknown artist";
  }

  function historyCard(t) {
    var href = safeUrl(t.url);
    // a track with no usable link still gets a card, just not an anchor
    var card = document.createElement(href ? "a" : "div");
    card.className = "card lastfm-history-card";
    if (href) {
      card.href = href;
      card.target = "_blank";
      card.rel = "noopener";
    }
    card.appendChild(coverEl(t, "lastfm-history-cover"));

    var info = document.createElement("span");
    info.className = "lastfm-history-info";
    var when = t.date && t.date["#text"];
    if (when) info.appendChild(line("span", "card-date", when));
    info.appendChild(line("span", "card-title", t.name || "unknown track"));
    info.appendChild(line("span", "card-desc", trackArtist(t)));
    card.appendChild(info);
    return card;
  }

  function renderHistory(tracks) {
    if (!historyId) return;
    var el = document.getElementById(historyId);
    if (!el) return;
    var rest = tracks.slice(1);
    el.textContent = "";
    if (!rest.length) {
      el.appendChild(line("p", "lastfm-status", "nothing else scrobbled yet."));
      return;
    }
    rest.forEach(function (t) { el.appendChild(historyCard(t)); });
  }

  function render(tracks) {
    if (!tracks || !tracks.length) {
      root.textContent = "";
      root.appendChild(line("p", tileMode ? "tile-live-title" : "lastfm-status", "nothing scrobbled yet."));
      return;
    }
    var first = tracks[0];
    var nowPlaying = !!(first["@attr"] && first["@attr"].nowplaying === "true");
    var label = nowPlaying ? "now playing" : "last played";

    var artist = trackArtist(first);
    var album = first.album && first.album["#text"];
    var title = first.name || "unknown track";

    if (tileMode) {
      root.textContent = "";
      root.appendChild(line("p", "tile-live-label", label));
      root.appendChild(line("p", "tile-live-title", title));
      root.appendChild(line("p", "tile-live-artist", artist));
      if (album) root.appendChild(line("p", "tile-live-album", album));

      var tileEl = root.closest(".tile-live-tile");
      // cover goes into a css url() here, so it needs the same scheme check
      // as any href — an unvalidated value could close the quote and inject
      // further declarations
      var tileCover = safeUrl(artUrl(first));
      if (tileEl && tileCover) {
        tileEl.style.backgroundImage = "url(" + JSON.stringify(tileCover) + ")";
        tileEl.classList.add("has-art");
      }
      renderHistory(tracks);
      return;
    }

    // aside mode: h2 label, square cover, h3 title, h4 artist/album
    var href = safeUrl(first.url);
    root.textContent = "";
    root.appendChild(line("h2", "lastfm-label", label));
    var coverLink = document.createElement(href ? "a" : "div");
    coverLink.className = "lastfm-cover-link";
    if (href) {
      coverLink.href = href;
      coverLink.target = "_blank";
      coverLink.rel = "noopener";
    }
    coverLink.appendChild(coverEl(first, "lastfm-cover"));
    root.appendChild(coverLink);
    root.appendChild(line("h3", "lastfm-track-title", title));
    root.appendChild(line("h4", "lastfm-track-artist", artist));
    if (album) root.appendChild(line("h4", "lastfm-track-album", album));
    renderHistory(tracks);
  }

  function fromCache() {
    try {
      var cached = JSON.parse(localStorage.getItem(cacheKey) || "null");
      if (cached && cached.tracks) render(cached.tracks);
    } catch (e) {}
  }

  function refresh() {
    // a backgrounded tab polling every 30s just burns quota against a
    // public api key — skip while hidden, and catch up on the way back
    if (document.hidden) return;
    fetch(endpoint)
      .then(function (r) { return r.json(); })
      .then(function (data) {
        var tracks = data && data.recenttracks && data.recenttracks.track;
        if (!tracks) throw new Error("no track data");
        if (!Array.isArray(tracks)) tracks = [tracks];
        render(tracks);
        localStorage.setItem(cacheKey, JSON.stringify({ tracks: tracks, at: Date.now() }));
      })
      .catch(function () {
        if (!root.querySelector(".lastfm-track-title, .tile-live-title")) fromCache();
      });
  }

  fromCache();
  refresh();
  setInterval(refresh, 30000);
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) refresh();
  });
})();
</script>
