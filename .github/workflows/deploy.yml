# Builds the site with the official Astro action and deploys it to GitHub
# Pages. Settings > Pages > Build and deployment > Source must be
# "GitHub Actions" for this workflow to publish the site.
# Based on https://github.com/withastro/action (README example).
# Actions are pinned to a commit; Dependabot keeps the pins current.
name: Deploy to GitHub Pages

on:
  push:
    branches: [metro-rebuild]
  # Rebuild daily so embargoed posts publish on their date.
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

# The build only reads the repository. The deploy job adds what it needs.
permissions:
  contents: read

# One deploy at a time. A newer push waits for the running deploy to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install, build, and upload the site
        uses: withastro/action@a8b97df764791eb61fbf3338ef713b0e61ae05c5 # v6.1.4

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
