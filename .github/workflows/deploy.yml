# Builds the site with the official Astro action and deploys it to GitHub
# Pages. Settings > Pages > Build and deployment > Source must be
# "GitHub Actions" for this workflow to publish the site.
# Based on https://github.com/withastro/action (README example).
name: Deploy to GitHub Pages

on:
  push:
    branches: [metro-rebuild]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. A newer push waits for the running deploy to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Install, build, and upload the site
        uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
