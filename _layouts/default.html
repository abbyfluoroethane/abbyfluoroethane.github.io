<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#eff1f5">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1e1e2e">
  <link rel="preload" href="{{ '/assets/fonts/selawkl.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ '/assets/fonts/selawk.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/metro/3.0.18/css/metro.min.css" integrity="sha384-e62zLAmzTmk6W8y6LlKtvIKFJTbNGrra4U/Uk4lJp7BlEzTn3H5L25O0PH4LPpcQ" crossorigin="anonymous">
  <link rel="stylesheet" href="{{ '/assets/css/foid.css' | relative_url }}">
</head>
<body>
  <div class="page-shell">
    <header class="site-header">
      <p class="site-title"><span class="accent">foid</span>.space</p>
      <nav class="site-nav">
        <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} class="current"{% endif %}>home</a>
        <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} class="current"{% endif %}>about</a>
      </nav>
    </header>
    <main>
{{ content }}
    </main>
  </div>
</body>
</html>
